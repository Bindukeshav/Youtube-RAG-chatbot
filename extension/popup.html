<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Doubt Solver</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --panel-2: #212121;
      --border: #2e2e2e;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --accent: #ff0033;
      --accent-dark: #cc0029;
      --link: #7cc4ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 400px;
      height: 540px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      font-size: 14px;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 38px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 14px; height: 14px; fill: #fff; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    /* ---------- Chat area ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      padding: 0 12px;
    }
    .empty-state .big { font-size: 34px; margin-bottom: 6px; }
    .empty-state h2 { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 600; }
    .empty-state p { margin: 0; font-size: 13px; }
    .empty-state em { color: var(--text); font-style: normal; }

    /* ---------- Messages ---------- */
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.user { justify-content: flex-end; }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .row.bot .avatar { background: var(--accent); color: #fff; }

    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .row.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .row.bot .bubble {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { color: #fff; }

    /* Timestamp links look like small pills */
    .bubble a {
      color: var(--link);
      text-decoration: none;
      background: rgba(124, 196, 255, 0.14);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .bubble a:hover { background: rgba(124, 196, 255, 0.28); }

    /* ---------- Typing dots ---------- */
    .bubble.typing { display: flex; gap: 4px; padding: 14px 16px; }
    .bubble.typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .bubble.typing span:nth-child(2) { animation-delay: 0.15s; }
    .bubble.typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ---------- Input bar ---------- */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    #question {
      flex: 1;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    #question::placeholder { color: var(--muted); }
    #question:focus { border-color: var(--accent); }

    #send {
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send:hover { background: var(--accent-dark); }
    #send:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div>
      <h1>Video Doubt Solver</h1>
      <p>Ask anything about this video</p>
    </div>
  </header>

  <div id="chat">
    <div class="empty-state">
      <div class="big">💬</div>
      <h2>Ask about the video you're watching</h2>
      <p>Try <em>"Who is the guest?"</em> or <em>"What is the main idea?"</em><br />
      Answers come with timestamps you can click.</p>
    </div>
  </div>

  <div class="input-bar">
    <input id="question" type="text" placeholder="Type your doubt..." autocomplete="off" autofocus />
    <button id="send" aria-label="Send question">Ask</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
