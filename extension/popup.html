<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    font-family: 'Roboto', 'Segoe UI', sans-serif;
    background: #0f0f0f;
  }
  .header {
    background: #181818;
    padding: 14px 16px;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #272727;
  }
  .header .logo {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: #ff0000;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .header .title { font-weight: 500; font-size: 14px; color: #fff; }
  .header .subtitle { font-size: 11px; color: #aaa; margin-top: 1px; }

  #chat {
    height: 260px;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #0f0f0f;
  }
  #chat::-webkit-scrollbar { width: 5px; }
  #chat::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

  .row { display: flex; gap: 6px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
    background: #272727;
  }
  .row.user .avatar { background: #3d1a1a; }

  .bubble {
    max-width: 220px;
    padding: 8px 12px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.45;
  }
  .row.user .bubble {
    background: #ff0000;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: #272727;
    color: #eee;
    border-bottom-left-radius: 4px;
  }

  .typing span {
    display: inline-block;
    width: 5px; height: 5px;
    margin-right: 3px;
    background: #888;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  .input-bar {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #181818;
    border-top: 1px solid #272727;
  }
  #question {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid #333;
    border-radius: 20px;
    font-size: 13px;
    outline: none;
    background: #121212;
    color: #eee;
  }
  #question::placeholder { color: #777; }
  #question:focus { border-color: #ff0000; }
  #send {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: #ff0000;
    color: white;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #send:hover { background: #d90000; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  .bubble p { margin: 0 0 6px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 18px; }
  .bubble li { margin-bottom: 3px; } 
  
  .empty-state {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 40px;
    padding: 0 24px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">▶</div>
    <div>
      <div class="title">Video Doubt Solver</div>
      <div class="subtitle">Ask anything about this video</div>
    </div>
  </div>

  <div id="chat">
    <div class="empty-state">Watching a video? Drop your doubt below and I'll dig through the transcript.</div>
  </div>

  <div class="input-bar">
    <input id="question" placeholder="Type your doubt..." />
    <button id="send">Ask</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
